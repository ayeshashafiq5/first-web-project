<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zero Waste Food Connect</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f4f9f4; padding: 50px; }
        .card { background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 40px; display: inline-block; max-width: 500px; }
        h1 { color: #2ecc71; }
        .btn { padding: 15px 25px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn-donate { background-color: #2ecc71; color: white; }
        .btn-collect { background-color: #3498db; color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Zero Waste Food Connect 🍎</h1>
        <p>Connecting surplus food from restaurants to NGOs in real-time.</p>
        <hr>
        <button class="btn btn-donate">I am a Restaurant</button>
        <button class="btn btn-collect">I am an NGO</button>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate Surplus Food - Zero Waste Food Connect</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f4f4f4; 
            padding: 50px; 
            margin: 0;
        }
        
        .card { 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            padding: 40px; 
            max-width: 500px; 
            margin: 0 auto;
            text-align: left;
        }

        h1 { color: #2ecc71; text-align: center; margin-bottom: 5px; }
        p.subtitle { color: #666; text-align: center; margin-bottom: 30px; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }

        /* Form Styling */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="text"], input[type="time"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        /* Buttons */
        .btn { 
            display: block;
            width: 100%;
            padding: 12px 0; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
            transition: 0.3s; 
            text-decoration: none;
            text-align: center;
        }

        .btn-submit { background-color: #2ecc71; color: white; margin-top: 25px; }
        .btn-home { background-color: #7f8c8d; color: white; margin-top: 10px; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="card">
        <h1>Post a Food Donation 🍏</h1>
        <p class="subtitle">Share your restaurant's surplus food with local communities.</p>
        <hr>

        <form onsubmit="alert('Donation posted successfully! (Mockup Only)'); return false;">
            <div class="form-group">
                <label for="restaurantName">Restaurant Name</label>
                <input type="text" id="restaurantName" placeholder="e.g., Gourmet Bistro" required>
            </div>

            <div class="form-group">
                <label for="foodItems">Food Items & Quantity</label>
                <input type="text" id="foodItems" placeholder="e.g., 15 Rice Boxes, 5 Burgers" required>
            </div>

            <div class="form-group">
                <label for="expiry">Best Before Time</label>
                <input type="time" id="expiry" required>
            </div>

            <div class="form-group">
                <label for="location">Area / Location</label>
                <select id="location">
                    <option>Gulberg III, Lahore</option>
                    <option>Johar Town, Lahore</option>
                    <option>DHA Phase 5, Lahore</option>
                    <option>Samanabad, Lahore</option>
                </select>
            </div>

            <button type="submit" class="btn btn-submit">Submit Donation Listing</button>
            <a href="index.html" class="btn btn-home">Cancel and Go Home</a>
        </form>
    </div>

</body>
</html>

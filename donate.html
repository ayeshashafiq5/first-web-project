<!DOCTYPE html>
<html lang="en">
<head>
    <title>Donate Food</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f4f9f4; }
        .form-card { background: white; padding: 30px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #2ecc71; color: white; border: none; width: 100%; padding: 12px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Donate Surplus Food 🍎</h2>
        <label>Food Item Name</label>
        <input type="text" placeholder="e.g. 10 Burgers, 5kg Rice">
        
        <label>Food Type</label>
        <select>
            <option>Cooked Meal</option>
            <option>Raw Ingredients</option>
            <option>Bakery Items</option>
        </select>

        <label>Pickup Location</label>
        <input type="text" placeholder="Enter your restaurant address">

        <button onclick="alert('Food Posted Successfully!')">Post Food Now</button>
        <br><br>
        <a href="index.html">← Back to Home</a>
    </div>
</body>
</html>
